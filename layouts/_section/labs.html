{{ define "main" }}
<h2>Labs</h2>
{{ range .Pages.ByDate.Reverse }}
<article class="lab-item">
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <div class="meta">
        {{ .Date.Format "2006-01-02" }} • {{ .Params.difficulty }}
    </div>
    <p>{{ .Summary }}</p>
</article>
{{ end }} {{ end }}
