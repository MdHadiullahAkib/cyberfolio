<!doctype html>
<html lang="en">

<head>
    {{ partial "meta.html" . }}
    <link rel="stylesheet" href="{{ "css/styles.css" | relURL }}">
</head>

<body>
    {{ partial "header.html" . }}
    {{ if not .IsHome }}
      <div class="layout-container">
    {{ end }}    
    {{ if not .IsHome }}
      {{ partial "sidebar.html" . }}
    {{ end }}
    <main class="content-area">
      {{ block "main" . }}{{ end }}
    </main>
    {{ if not .IsHome }}
      </div>
    {{ end }}
    {{ partial "footer.html" . }}
</body>

</html>
